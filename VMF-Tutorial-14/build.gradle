plugins {
    id 'application'
    id 'eu.mihosoft.vmf'
}

repositories {
    clear()
    mavenCentral()
}

application {
    mainClass = 'eu.mihosoft.vmf.tutorial14.Main'
}

tasks.named('javadoc', Javadoc) {
    // VMF 0.4.0 generates a few @see tags that point to missing methods.
    options.addBooleanOption('Xdoclint:none', true)
}


tasks.named('check') {
    dependsOn tasks.named('javadoc')
}
