name: VMF Tutorials

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tutorials:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and run tutorials
        if: runner.os != 'Windows'
        run: ./build-and-run-all.sh
      - name: Build and run tutorials
        if: runner.os == 'Windows'
        shell: cmd
        run: call build-and-run-all.bat
